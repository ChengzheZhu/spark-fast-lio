---
launch:
  - arg: {name: start_rviz,  default: 'false', description: automatically start rviz}
  - arg: {name: config_path, default: $(find-pkg-share spark_fast_lio)/config/mid360s.yaml, description: Mid-360S config}
  - arg: {name: rviz_path,   default: $(find-pkg-share spark_fast_lio)/rviz/ouster_vbr.rviz, description: rviz file to load}
  - arg: {name: lidar_topic, default: '/livox/lidar', description: Livox CustomMsg topic}
  - arg: {name: imu_topic,   default: '/livox/imu',   description: Livox IMU topic}

  - node:
      pkg: spark_fast_lio
      exec: spark_lio_mapping
      name: lio_mapping
      output: screen
      on_exit: shutdown

      remap:
        - { from: 'lidar', to: '$(var lidar_topic)' }
        - { from: 'imu',   to: '$(var imu_topic)' }

      param:
        - from: $(var config_path)

  - node:
      if: $(var start_rviz)
      pkg: rviz2
      exec: rviz2
      name: "rviz"
      launch-prefix: "nice"
      output: "screen"
      args: >
        -d $(var rviz_path)
